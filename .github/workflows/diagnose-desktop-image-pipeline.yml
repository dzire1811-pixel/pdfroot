name: Inspect PDFRoot desktop image engine
on:
  push:
    branches: [codex/fast-shortcuts-image-fidelity-beta15]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event.head_commit.message == 'Inspect Front Back output color test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p /tmp/pdfroot-beta
          unzip -q .release/PDFRoot-Desktop-Pro-Beta9-Tool-Icons-Right-Click-Build-Kit.zip -d /tmp/pdfroot-beta
          cd /tmp/pdfroot-beta/PDFRoot-Desktop-Pro-Beta9-Tool-Icons-Right-Click-Build-Kit/desktop/resources/app/src
          echo 'PDFROOT_CARD_COLOR_TEST_START'
          sed -n '188,246p' local-auto.test.cjs
          echo 'PDFROOT_CARD_COLOR_TEST_END'
