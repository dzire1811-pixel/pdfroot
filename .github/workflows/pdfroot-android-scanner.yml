name: PDFRoot Android Scanner APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/pdfroot-scanner/**'
      - '.github/workflows/pdfroot-android-scanner.yml'
jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: android/pdfroot-scanner
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PDFRoot-Scanner-Debug-APK
          path: android/pdfroot-scanner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
