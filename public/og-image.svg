  <text x="210" y="130" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">PDFRoot</text>
  <text x="210" y="170" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" fill="#2563eb">Fast, Secure &amp; Free PDF Tools</text>
  <text x="88" y="292" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="900" fill="#0f172a">All Your PDF Tools</text>
  <text x="88" y="374" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="900" fill="#0f172a">in One Place</text>
  <text x="92" y="430" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#475569">Merge, split, compress, convert, and manage PDFs in seconds.</text>
